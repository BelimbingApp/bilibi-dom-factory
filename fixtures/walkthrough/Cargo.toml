# Walkthrough fixture for the Factory container: never a product dependency and
# never discovered (Platform discovery skips `fixtures/`). It is its own
# Cargo workspace root so it can be built and run from here once the container
# is mounted; see the container README ("Walkthrough fixture").
[package]
name = "bilibi-factory-walkthrough"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
default-run = "bilibi-factory-walkthrough"

[[bin]]
name = "product-definition"
path = "src/product_definition.rs"

[[bin]]
name = "genealogy"
path = "src/genealogy.rs"

[[bin]]
name = "agent-operations"
path = "src/agent_operations.rs"

[[bin]]
name = "product-definition-pages"
path = "src/product_definition_pages.rs"

[[bin]]
name = "production-execution"
path = "src/production_execution.rs"

[workspace]

[dependencies]
bilibi-agent-access = { path = "../../../../core/agent_access" }
bilibi-agent-api = { path = "../../../../base/agent_api" }
bilibi-authz = { path = "../../../../base/authz" }
bilibi-database = { path = "../../../../base/database" }
bilibi-tenancy = { path = "../../../../base/tenancy" }
bilibi-factory-inventory = { path = "../../inventory" }
bilibi-factory-product-definition = { path = "../../product_definition" }
bilibi-factory-production-execution = { path = "../../production_execution" }
bilibi-audit = { path = "../../../../base/audit" }
bilibi-walkthrough-fixture = { path = "../../../../../fixtures/walkthrough" }
bilibi-web = { path = "../../../../web" }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

# XP2 capture proof, run after production-execution on the same disposable DB.
[[bin]]
name = "shop-floor"
path = "src/shop_floor.rs"


# XP3 live-page proof and browser host; run after production-execution and shop-floor.
[[bin]]
name = "floor-pages"
path = "src/floor_pages.rs"

[dependencies.bilibi-ui]
path = "../../../../base/ui"

[dependencies.bilibi-datetime]
path = "../../../../base/datetime"

[dependencies.jiff]
version = "0.2.38"

[dependencies.bilibi-settings]
path = "../../../../base/settings"

# H6 reviewed production operations on a freshly migrated disposable DB.
[[bin]]
name = "production-operations"
path = "src/production_operations.rs"

# XP4 labour/configuration page proof and browser host; run after floor-pages.
[[bin]]
name = "labour-pages"
path = "src/labour_pages.rs"

# V4 browser host: empty-state sweep, then the populated floor walkthroughs.
[[bin]]
name = "factory-pages"
path = "src/factory_pages.rs"
